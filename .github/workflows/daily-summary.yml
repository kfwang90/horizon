name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 23:00 UTC is 07:00 Asia/Shanghai.
    - cron: '15 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    # The digest now includes every fetched item, so enrichment runs on all of
    # them; give the run more headroom than a curated top-N would need.
    timeout-minutes: 120
    # Never let two runs push source/horizon at the same time; queue them instead.
    concurrency:
      group: daily-summary
      cancel-in-progress: false
    permissions:
      contents: write     # Needed to push this repo (and read for checkout)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"

      - name: Install dependencies
        run: uv sync --extra youtube

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      # Only export HORIZON_WEBHOOK_URL when the secret actually has a value.
      # Setting it to "" makes Horizon abort with:
      #   ValueError: Webhook URL is empty (env var ... is set but empty)
      - name: Export webhook URL (only if configured)
        env:
          WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "HORIZON_WEBHOOK_URL=$WEBHOOK_URL" >> "$GITHUB_ENV"
          else
            echo "HORIZON_WEBHOOK_URL not configured; webhook notifications will be skipped."
          fi

      - name: Run Horizon
        env:
          # data/config.github.json uses ai.api_key_env = OPENROUTER_API_KEY
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model id (ai.model = ${HORIZON_AI_MODEL}); override via repo variable
          # HORIZON_AI_MODEL, otherwise falls back to the default below.
          HORIZON_AI_MODEL: ${{ vars.HORIZON_AI_MODEL || 'google/gemini-2.5-flash-lite' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          # X/Twitter via the Apify Scweet actor (sources.twitter.mode=apify).
          # Without this secret the twitter source logs a warning and is skipped.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # NOTE: HORIZON_WEBHOOK_URL is exported by the step above, only when
          # the secret is non-empty (an empty value would abort the run).
          # Optional: raise GitHub API rate limits used by the github source
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --extra youtube matters: a bare `uv run` re-syncs the venv without
        # extras, which would uninstall yt-dlp again.
        run: uv run --extra youtube horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # docs/_posts is git-ignored, so a fresh runner only has today's
      # digest. Restore the previously published ones from the deploy repo's
      # .horizon-archive/posts/ before building: otherwise the index page's
      # 每日速递 / 近期消息 lists (and every older digest page) vanish.
      # ------------------------------------------------------------------
      - name: Restore digest history from the deploy repo
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          TARGET_REPO: ${{ vars.PAGES_REPO || format('{0}/{0}.github.io', github.repository_owner) }}
        run: |
          set -euo pipefail
          SITE_DIR="${{ runner.temp }}/horizon-site"
          if [ -z "${PAGES_DEPLOY_TOKEN}" ]; then
            echo "::warning::PAGES_DEPLOY_TOKEN is not set; building today's digest only."
            exit 0
          fi
          rm -rf "$SITE_DIR"
          if ! git clone \
            "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/${TARGET_REPO}.git" \
            "$SITE_DIR"; then
            echo "::warning::could not clone ${TARGET_REPO}; building without history."
            exit 0
          fi
          if [ -d "$SITE_DIR/.horizon-archive/posts" ]; then
            # -n keeps today's freshly generated post.
            cp -n "$SITE_DIR"/.horizon-archive/posts/*.md docs/_posts/ || true
            echo "Restored digest history: $(ls -1 docs/_posts | wc -l) file(s)."
          else
            echo "No archive yet; history starts with this run."
          fi

      # ------------------------------------------------------------------
      # Publish the daily report into the existing Hexo site:
      #   https://www.01040610.xyz/horizon/   (custom domain; the
      #   kfwang90.github.io URL 301-redirects here)
      #
      # docs/ is itself a Jekyll site, so we pre-build it to plain static
      # files and copy them into the Hexo repo's source/horizon/. Hexo's
      # `generate` copies source/horizon/** verbatim into public/horizon/**,
      # and the target repo's existing workflow (static.yml) deploys public/.
      #
      # We push with plain git instead of peaceiris/actions-gh-pages on
      # purpose: that action's `exclude_assets` defaults to `.github`, so it
      # DELETES the target repo's workflows, and its subdirectory input is
      # `destination_dir` (not `dest_dir`). Doing it by hand only ever
      # touches source/horizon/.
      #
      # A PAT is required because GITHUB_TOKEN can only write to this repo.
      # ------------------------------------------------------------------
      - name: Point the Horizon site at the /horizon subpath
        run: |
          SITE_URL="${{ vars.PAGES_SITE_URL || 'https://www.01040610.xyz' }}"
          sed -i 's#^baseurl:.*#baseurl: "/horizon"#' docs/_config.yml
          sed -i "s#^url:.*#url: \"${SITE_URL}\"#" docs/_config.yml
          grep -E '^(baseurl|url):' docs/_config.yml

      - name: Build the Horizon site (Jekyll -> static files)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./docs/_site

      - name: Publish into the Hexo repo (source/horizon + history archive)
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          # Target repo. Defaults to <owner>/<owner>.github.io
          # (kfwang90/kfwang90.github.io); override with a repository
          # variable PAGES_REPO if needed.
          TARGET_REPO: ${{ vars.PAGES_REPO || format('{0}/{0}.github.io', github.repository_owner) }}
        run: |
          set -euo pipefail
          SITE_DIR="${{ runner.temp }}/horizon-site"
          if [ ! -d "$SITE_DIR/.git" ]; then
            rm -rf "$SITE_DIR"
            git clone \
              "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/${TARGET_REPO}.git" \
              "$SITE_DIR"
          fi

          # Replace only source/horizon; never touch anything else.
          rm -rf "$SITE_DIR/source/horizon"
          mkdir -p "$SITE_DIR/source/horizon"
          cp -a docs/_site/. "$SITE_DIR/source/horizon/"

          # Keep the digest markdown (each post carries its item list) so the
          # next run can rebuild the last week. Kept outside source/ so Hexo
          # never publishes it.
          mkdir -p "$SITE_DIR/.horizon-archive/posts"
          find docs/_posts -maxdepth 1 -name '*.md' \
            -exec cp -f {} "$SITE_DIR/.horizon-archive/posts/" \;

          cd "$SITE_DIR"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A source/horizon .horizon-archive
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "📝 Horizon daily: ${DATE}"
            if ! git push origin HEAD:main; then
              echo "Push rejected; rebasing on the remote and retrying once."
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
