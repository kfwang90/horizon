name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 23:00 UTC is 07:00 Asia/Shanghai.
    - cron: '0 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Needed to push this repo (and read for checkout)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # data/config.github.json uses ai.api_key_env = OPENROUTER_API_KEY
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model id (ai.model = ${HORIZON_AI_MODEL}); override via repo variable
          # HORIZON_AI_MODEL, otherwise falls back to the default below.
          HORIZON_AI_MODEL: ${{ vars.HORIZON_AI_MODEL || 'google/gemini-2.5-flash-lite' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          # Optional: raise GitHub API rate limits used by the github source
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # Publish the daily report into your existing Pages site, as a
      # subdirectory: https://<owner>.github.io/horizon/
      #
      # The docs/ folder is a Jekyll site, so we build it to static files
      # here; a nested _posts/ directory would NOT be processed if we pushed
      # the raw Jekyll sources into a subdirectory of the parent site.
      # ------------------------------------------------------------------
      - name: Point the Horizon site at the /horizon subpath
        run: |
          sed -i 's#^baseurl:.*#baseurl: "/horizon"#' docs/_config.yml
          sed -i "s#^url:.*#url: \"https://${{ github.repository_owner }}.github.io\"#" docs/_config.yml
          grep -E '^(baseurl|url):' docs/_config.yml

      - name: Build the Horizon site (Jekyll -> static files)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./docs/_site

      - name: Deploy to <owner>.github.io/horizon
        uses: peaceiris/actions-gh-pages@v4
        with:
          # PAT with write access to the target Pages repo (GITHUB_TOKEN can
          # only push to this repo, not to another one).
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          # Defaults to <owner>/<owner>.github.io; override with a repository
          # variable PAGES_REPO if the target repo lives elsewhere.
          external_repository: ${{ vars.PAGES_REPO || format('{0}/{0}.github.io', github.repository_owner) }}
          publish_branch: main
          publish_dir: ./docs/_site
          dest_dir: horizon
          keep_files: true      # keep the rest of your existing site
          enable_jekyll: true   # do NOT write .nojekyll (your site needs Jekyll)
          commit_message: "📝 Horizon daily: ${{ env.DATE }}"
