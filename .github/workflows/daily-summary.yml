name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 23:00 UTC is 07:00 Asia/Shanghai.
    - cron: '0 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Needed to push this repo (and read for checkout)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      # Only export HORIZON_WEBHOOK_URL when the secret actually has a value.
      # Setting it to "" makes Horizon abort with:
      #   ValueError: Webhook URL is empty (env var ... is set but empty)
      - name: Export webhook URL (only if configured)
        env:
          WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "HORIZON_WEBHOOK_URL=$WEBHOOK_URL" >> "$GITHUB_ENV"
          else
            echo "HORIZON_WEBHOOK_URL not configured; webhook notifications will be skipped."
          fi

      - name: Run Horizon
        env:
          # data/config.github.json uses ai.api_key_env = OPENROUTER_API_KEY
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model id (ai.model = ${HORIZON_AI_MODEL}); override via repo variable
          # HORIZON_AI_MODEL, otherwise falls back to the default below.
          HORIZON_AI_MODEL: ${{ vars.HORIZON_AI_MODEL || 'google/gemini-2.5-flash-lite' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          # NOTE: HORIZON_WEBHOOK_URL is exported by the step above, only when
          # the secret is non-empty (an empty value would abort the run).
          # Optional: raise GitHub API rate limits used by the github source
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # Publish the daily report into the existing Hexo site:
      #   https://kfwang90.github.io/horizon/
      #
      # docs/ is itself a Jekyll site, so we pre-build it to plain static
      # files and push them into the Hexo repo's source/horizon/. Hexo's
      # `generate` copies source/horizon/** verbatim into public/horizon/**,
      # and the target repo's existing Actions workflow (static.yml)
      # deploys public/ via deploy-pages.
      #
      # Note: pushing to the target repo's main branch is what triggers its
      # Hexo deploy workflow. We use a PAT because GITHUB_TOKEN can only
      # push/publish within this repo.
      # ------------------------------------------------------------------
      - name: Point the Horizon site at the /horizon subpath
        run: |
          sed -i 's#^baseurl:.*#baseurl: "/horizon"#' docs/_config.yml
          sed -i "s#^url:.*#url: \"https://${{ github.repository_owner }}.github.io\"#" docs/_config.yml
          grep -E '^(baseurl|url):' docs/_config.yml

      - name: Build the Horizon site (Jekyll -> static files)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./docs/_site

      - name: Deploy daily report into the Hexo repo (source/horizon)
        uses: peaceiris/actions-gh-pages@v4
        with:
          # PAT with write access to the target Pages repo (GITHUB_TOKEN can
          # only push to this repo, not to another one).
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          # Target repo. Defaults to <owner>/<owner>.github.io
          # (kfwang90/kfwang90.github.io); override with a repository
          # variable PAGES_REPO if needed.
          external_repository: ${{ vars.PAGES_REPO || format('{0}/{0}.github.io', github.repository_owner) }}
          publish_branch: main
          publish_dir: ./docs/_site
          # Hexo copies source/horizon/** verbatim into public/horizon/**
          dest_dir: source/horizon
          keep_files: true      # keep the rest of the Hexo repo untouched
          enable_jekyll: true   # do not write a .nojekyll file
          commit_message: "📝 Horizon daily: ${{ env.DATE }}"
